name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # The point of the fixture + mock providers: CI exercises the real
      # pipeline — discovery, normalisation, extraction, dedupe, scoring — with
      # no API keys, no network, and no spend.
      - name: Pipeline smoke test
        run: npm run ingest:fixtures

      - name: Assert the run actually stored something coherent
        run: |
          node -e "
            const s = require('./.data/store.json');
            const n = s.studies.length;
            if (n < 50) { console.error('expected >= 50 studies, got ' + n); process.exit(1); }

            // Every stored row must carry a representation the schema allows.
            const bad = s.studies.filter(x => !['none','partial','primary','unclear'].includes(x.representation));
            if (bad.length) { console.error('invalid representation on ' + bad.length + ' rows'); process.exit(1); }

            // A row claiming a South Asian recruiting country must not also be
            // marked 'none'. That combination is the analysis inverting itself.
            const SA = ['pakistan','india','bangladesh','sri lanka','nepal','bhutan','maldives'];
            const contradictory = s.studies.filter(x =>
              x.representation === 'none' && x.countries.some(c => SA.includes(String(c).toLowerCase())));
            if (contradictory.length) {
              console.error('rows marked none despite a South Asian site: ' + contradictory.length);
              process.exit(1);
            }

            // Gaps must be derived from the rows, not left stale.
            if (!s.gaps.length) { console.error('no gaps computed'); process.exit(1); }
            const total = s.gaps.reduce((a, g) => a + g.total_studies, 0);
            if (total !== n) { console.error('gap counts (' + total + ') do not sum to studies (' + n + ')'); process.exit(1); }

            console.log('pipeline smoke test ok: ' + n + ' studies, ' + s.gaps.length + ' conditions');
          "

      # Informational: the rule-based baseline is expected to hallucinate on an
      # index page. That failure is the documented finding, not a broken build,
      # so this runs without --strict. Gate a real model with `-- --strict`.
      - name: Extraction eval (baseline)
        run: npm run eval:baseline

      - run: npm run build
